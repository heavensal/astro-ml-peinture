# Déploiement GitHub Pages.
# Prérequis : Settings → Pages → Source : GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          PUBLIC_SITE_INDEXABLE: ${{ vars.PUBLIC_SITE_INDEXABLE }}
          PUBLIC_CONTACT_FORM_URL: ${{ vars.PUBLIC_CONTACT_FORM_URL }}
          PUBLIC_CONTACT_FORM_TOKEN: ${{ secrets.PUBLIC_CONTACT_FORM_TOKEN }}
          CONTENTFORGE_URL: ${{ vars.CONTENTFORGE_URL }}
          CONTENTFORGE_API_TOKEN: ${{ secrets.CONTENTFORGE_API_TOKEN }}
          CONTENTFORGE_FAQ_ENABLED: ${{ vars.CONTENTFORGE_FAQ_ENABLED }}
          CONTENTFORGE_REVIEWS_ENABLED: ${{ vars.CONTENTFORGE_REVIEWS_ENABLED }}
          CONTENTFORGE_ARTICLES_ENABLED: ${{ vars.CONTENTFORGE_ARTICLES_ENABLED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
